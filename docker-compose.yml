version: '3.8'

services:
  # 1. PostgreSQL Database Warehouse
  postgres:
    image: postgres:15-alpine
    container_name: earnings_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: transcripts_warehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transcripts_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: earnings_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. FastAPI Ingestion Gateway
  api:
    build: .
    container_name: earnings_api
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/transcripts_warehouse
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Celery Worker (NLP & Scraper Pipeline)
  worker:
    build: .
    container_name: earnings_celery_worker
    restart: always
    command: celery -A workers.tasks worker --loglevel=info --pool=solo
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/transcripts_warehouse
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  # 5. Streamlit Analytics Dashboard
  dashboard:
    build: .
    container_name: earnings_dashboard
    restart: always
    command: streamlit run dashboard/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/transcripts_warehouse
    depends_on:
      - postgres

volumes:
  postgres_data: